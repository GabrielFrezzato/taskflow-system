# ============================================================
#  TaskFlow — Configuração de ferramentas Python
# ============================================================

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Só as regras essenciais — mesmas do default do ruff
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E741",  # nomes de variáveis ambíguos (l, O, I)
]

[tool.ruff.lint.per-file-ignores]
"backend/__init__.py"        = ["F401"]
"backend/routes/__init__.py" = ["F401"]
"backend/database.py"        = ["F401"]  # models importado por side-effect (registra tabelas)

# ─── Pytest ─────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths    = ["backend/tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

# ─── Mypy ───────────────────────────────────────────────────
[tool.mypy]
python_version       = "3.12"
ignore_missing_imports = true
