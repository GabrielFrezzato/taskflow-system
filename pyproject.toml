# ============================================================
#  TaskFlow — Configuração de ferramentas Python
#  (ruff, mypy, pytest)
# ============================================================

[tool.ruff]
line-length = 100
target-version = "py312"

# Apenas regras essenciais — sem falsos positivos em portfólio
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (imports não usados, etc.)
    "W",   # pycodestyle warnings
]
ignore = [
    "E501",  # linha longa — controlado por line-length acima
    "E741",  # nomes de variáveis ambíguos (l, O, I)
    "F811",  # redefinição de nome (ex: Priority em models e schemas)
]
exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "backend/tests/",
]

[tool.ruff.per-file-ignores]
"backend/__init__.py" = ["F401"]
"backend/routes/__init__.py" = ["F401"]

# ─── Pytest ─────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
log_cli = true
log_cli_level = "INFO"

# ─── Mypy ───────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
